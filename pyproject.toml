[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vendor-orchestrator"
version = "0.1.0"
description = "Portfolio case-orchestration service: FastAPI + mock vendors + Postgres + eval harness"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Ashish Kosana" }]
keywords = ["fastapi", "orchestration", "postgres", "evals", "portfolio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[project.urls]
Repository = "https://github.com/Ashishkosana/vendor-orchestrator"

[project.scripts]
vendor-orchestrator-evals = "vendor_orchestrator.eval_harness:main"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["vendor_orchestrator"]
pretty = true

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true
