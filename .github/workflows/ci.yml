name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Quoted: a trailing colon in :memory: is invalid unquoted YAML.
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TEST_DATABASE_URL: "sqlite+aiosqlite:///:memory:"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests evals

      - name: Ruff format
        run: ruff format --check src tests evals

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q

      - name: Eval harness (fixture-run scores only)
        run: python -m vendor_orchestrator.eval_harness
